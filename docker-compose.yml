version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: stella-neo4j
    restart: unless-stopped
    ports:
      # Loopback only — LAN devices must not reach the graph directly
      - "127.0.0.1:7474:7474"   # Browser UI
      - "127.0.0.1:7687:7687"   # Bolt protocol
    environment:
      # NEO4J_PASS comes from the gitignored .env in this directory
      NEO4J_AUTH: neo4j/${NEO4J_PASS:?set NEO4J_PASS in .env}
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  api:
    build:
      context: .
      dockerfile: api_bridge/Dockerfile
    container_name: stella-api
    restart: unless-stopped
    depends_on:
      - neo4j
    ports:
      - "127.0.0.1:3010:3010"
    env_file:
      - api_bridge/.env.api
    environment:
      STELLA_API_HOST: 0.0.0.0
      STELLA_API_PORT: 3010
      SWEPH_API_BASE: http://host.docker.internal:3000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: ${NEO4J_PASS:?set NEO4J_PASS in .env}
    volumes:
      - ./charts:/app/stella/charts:ro
      - /Users/punkrecords/services/helios/ephemeris:/mnt/baratie/baratie/sweph-service/ephemeris:ro

volumes:
  neo4j_data:
  neo4j_logs:
